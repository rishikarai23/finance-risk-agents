<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin-top: 15px;
            margin-bottom: 15px;
            margin-right: 15px;
            margin-left: 15px;
            color: #b8b5b5;
            background-color: #060237;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            font-size: 28px;
            font-weight: 600;
            color: #dddde1;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .subtitle {
            font-size: 14px;
            font-weight: 300;
            color: #b8b5b5;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .scoregrid {
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 15px;
            margin-bottom: 25px;
        }
        .scorescard {
            background-color: #040122;
            border: 1px solid #0c0cad ;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .scorescard .label {
            font-size: 20px;
            font-weight: 300;
            text-transform: uppercase;
            color: #bcbcd3;
            margin-bottom: 10px;
            margin-top: 20px;
        }
        .scorescard .value {
            font-size: 30px;
            font-weight: 500;  
        }
        .scorescard .sublabel {
            font-size: 15px;
            font-weight: 10px;
            margin-top: 12px;
            color: #8a85c4;
            font-weight: 100;
        }

    </style>
</head>
<body>
    <div class="container">
        <h1>Financial Risk Analysis</h1>
        <p class="subtitle">This is the pdf report for {{ context.company_name }} </p>
        <div class="scoregrid">
            <div class="scorescard">
                <div class="label">Contradictions</div>
                <div class="value" id="contradiction">9</div>
            </div>
            <div class="scorescard">
                <div class="label">Risk Score</div>
                <div class="value" id="riskscore">10</div>
            </div>
            <div class="scorescard">
                <div class="label">Sentiment Score</div>
                <div class="value" id="sentimentscore">11</div>
            </div>
        </div>
    </div>
</body>
</html>

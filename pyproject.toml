[project]
name = "finance-risk-agents"
version = "0.1.0"
description = "Multi Agent Financial Risk Intelligence System"
requires-python = ">=3.1"

[project.dependencies]
anthropic = ">=0.25.0"
langgraph = ">=0.1.0"
pydantic = ">=2.0.0"
fastapi = ">=0.110.0"
uvicorn = ">=0.29.0"
chromadb = ">=0.4.0"
python-dotenv = ">=1.0.0"
httpx = ">=0.27.0"
yfinance = ">=0.2.0"
alpha-vantage = ">=2.3.1"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=24.0.0",
    "ruff>=0.4.0",
]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
